name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ZIG_VERSION: 0.15.2

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Format check
        run: zig fmt --check build.zig src

      - name: Unit tests
        run: zig build test

      - name: Build native
        run: zig build -Doptimize=ReleaseSafe

      - name: Build WASI
        run: zig build -Dtarget=wasm32-wasi -Doptimize=ReleaseSafe

      - name: Fixture matrix
        run: ./tests/run-fixtures.sh
