name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  ZIG_VERSION: 0.15.2

jobs:
  release:
    name: Build WASM & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build WASM
        shell: bash
        run: |
          set -euo pipefail
          zig build -Dtarget=wasm32-wasi -Doptimize=ReleaseSafe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Package & Publish npm Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist

          # Determine npm tag based on whether it's a GitHub prerelease or contains a hyphen (e.g., -beta)
          npm_tag="latest"
          if [[ "$IS_PRERELEASE" == "true" ]] || [[ "$version" == *-* ]]; then
            npm_tag="beta"
          fi
          echo "Publishing to npm with tag: $npm_tag"

          # Copy repo documentation/licenses directly into zig-out
          cp README.md LICENSE zig-out/

          for pkg in "drml" "@drml/cli"; do
            # Overwrite package.json inside zig-out for the current target name
            cat > zig-out/package.json <<EOF
          {
            "name": "${pkg}",
            "version": "${version}",
            "description": "drml WebAssembly CLI",
            "license": "MIT",
            "repository": "https://github.com/drmlStudio/drml"
          }
          EOF

            # Pack and publish whatever is inside zig-out using the dynamic npm tag
            npm pack ./zig-out --pack-destination dist
            npm publish ./zig-out --access public --tag "$npm_tag"
          done

      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            zig-out/bin/drml.wasm
            dist/*.tgz
