name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

env:
  ZIG_VERSION: 0.15.2

jobs:
  release:
    name: Build WASM & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build WASM
        shell: bash
        run: |
          set -euo pipefail
          zig build -Dtarget=wasm32-wasi -Doptimize=ReleaseSafe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          npm_tag="latest"
          if [[ "$IS_PRERELEASE" == "true" ]] || [[ "$version" == *-* ]]; then
            npm_tag="beta"
          fi

          cd zig-out
          npm publish --provenance --access public --tag "$npm_tag"

      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            zig-out/bin/drml.wasm