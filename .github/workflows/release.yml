name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  ZIG_VERSION: 0.15.2

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            archive: linux-x86_64
          - target: aarch64-linux-gnu
            archive: linux-aarch64
          - target: x86_64-macos-none
            archive: macos-x86_64
          - target: aarch64-macos-none
            archive: macos-aarch64
          - target: x86_64-windows-gnu
            archive: windows-x86_64
          - target: wasm32-wasi
            archive: wasm32-wasi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build and package
        shell: bash
        env:
          DRML_TARGET: ${{ matrix.target }}
          DRML_ARCHIVE: ${{ matrix.archive }}
          DRML_VERSION: ${{ github.event.release.tag_name }}
        run: ./scripts/package-release.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip
