<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 820 400" width="820" height="400">
  <defs>
    <clipPath id="crystal-wipe">
      <rect id="wipe-rect" x="-50" y="-85" width="135" height="170" />
    </clipPath>
  </defs>

  <style type="text/css">
    <![CDATA[
    .speed-line {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: drawLine 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .line-top-outer { animation-delay: 0.05s; }
    .line-top-inner { animation-delay: 0.12s; }
    .line-bot-inner { animation-delay: 0.10s; }
    .line-bot-outer { animation-delay: 0.17s; }

    #wipe-rect {
      transform-origin: -45px 0px;
      transform: scaleX(0);
      animation: wipeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
    }

    .crystal-head {
      opacity: 0;
      animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.22s forwards;
    }

    .text-group {
      opacity: 0;
      transform: translate(320px, 235px);
      animation: revealText 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes wipeIn {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translate(-16px, 0);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0);
      }
    }

    @keyframes revealText {
      0% {
        opacity: 0;
        transform: translate(320px, 235px);
      }
      100% {
        opacity: 1;
        transform: translate(340px, 235px);
      }
    }
    ]]>
  </style>

  <!-- Logo Mark -->
  <g transform="translate(200, 200) scale(1.05)">
    <!-- Speed Lines -->
    <path class="speed-line line-top-outer" d="M -135,-90 L -60,-35 L -45,-30" fill="none" stroke="#6366f1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path class="speed-line line-top-inner" d="M -135,-32 L -60,-15 L -45,-12" fill="none" stroke="#818cf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path class="speed-line line-bot-inner" d="M -135,32 L -60,15 L -45,12" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path class="speed-line line-bot-outer" d="M -135,90 L -60,35 L -45,30" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Crystal Head -->
    <g class="crystal-head" clip-path="url(#crystal-wipe)">
      <polygon points="-45,-75 -45,75 5,0" fill="#7c3aed" />
      <polygon points="-45,-75 35,-42 5,0" fill="#f59e0b" />
      <polygon points="35,-42 75,0 5,0" fill="#fde047" />
      <polygon points="75,0 35,42 5,0" fill="#ea580c" />
      <polygon points="35,42 -45,75 5,0" fill="#9a3412" />
    </g>
  </g>

  <!-- Animated Text -->
  <g class="text-group">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" letter-spacing="4">DRML</text>
  </g>
</svg>
